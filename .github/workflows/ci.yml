name: Build and Deploy Reservation Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/mmdhosain/reservation-bot:latest
            ghcr.io/mmdhosain/reservation-bot:${{ github.sha }}

  deploy:
    name: 🚀 Deploy to VPS via SSH & Docker
    needs: [test, build-and-push]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          RAW_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SERVER_SSH_KEY }}
          RAW_HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          RAW_PORT: ${{ secrets.VPS_PORT || secrets.SERVER_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          : "${RAW_SSH_KEY:?Missing SSH Key secret (VPS_SSH_KEY or SERVER_SSH_KEY)}"
          : "${RAW_HOST:?Missing Host secret (VPS_HOST or SERVER_HOST)}"

          # Clean inputs (strip carriage returns, quotes, trailing whitespaces)
          CLEAN_KEY=$(printf '%s\n' "$RAW_SSH_KEY" | tr -d '\r')
          CLEAN_HOST=$(printf '%s' "$RAW_HOST" | tr -d '\r\n\t "' | sed -e 's|^ssh://||' -e 's|^.*@||')
          CLEAN_PORT=$(printf '%s' "${RAW_PORT:-22}" | tr -d '\r\n\t "')

          # Extract port if host was entered as 'ip:port'
          if printf '%s' "$CLEAN_HOST" | grep -q ":"; then
            CLEAN_PORT=$(printf '%s' "$CLEAN_HOST" | cut -d: -f2)
            CLEAN_HOST=$(printf '%s' "$CLEAN_HOST" | cut -d: -f1)
          fi

          echo "TARGET_HOST=$CLEAN_HOST" >> "$GITHUB_ENV"
          echo "TARGET_PORT=${CLEAN_PORT:-22}" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$CLEAN_KEY" > "$HOME/.ssh/reservation_deploy"
          chmod 600 "$HOME/.ssh/reservation_deploy"

          ssh-keygen -y -f "$HOME/.ssh/reservation_deploy" > /dev/null

          ssh-keyscan -p "${CLEAN_PORT:-22}" -H "$CLEAN_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to VPS
        shell: bash
        env:
          VPS_USER: ${{ secrets.VPS_USER || secrets.SERVER_USER || 'root' }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          CLEAN_USER=$(printf '%s' "${VPS_USER:-root}" | tr -d '\r\n\t "' | sed -e 's|@.*||')
          HOST="$TARGET_HOST"
          PORT="$TARGET_PORT"

          echo "📡 Connecting to: $CLEAN_USER@$HOST on port $PORT"

          SSH=(
            ssh
            -i "$HOME/.ssh/reservation_deploy"
            -p "$PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=30
          )

          SCP=(
            scp
            -i "$HOME/.ssh/reservation_deploy"
            -P "$PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=30
          )

          # Step 1: Authenticate Docker on the VPS with GHCR
          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "🔑 Authenticating Docker with GHCR on VPS..."
            printf '%s' "$GHCR_READ_TOKEN" | \
              "${SSH[@]}" "$CLEAN_USER@$HOST" \
                'docker login ghcr.io --username mmdhosain --password-stdin' || true
          fi

          # Step 2: Ensure destination directory and copy deployment files
          echo "📁 Syncing docker-compose.yml and .env.example to VPS..."
          "${SSH[@]}" "$CLEAN_USER@$HOST" 'mkdir -p /root/reservation_bot'
          "${SCP[@]}" docker-compose.yml "$CLEAN_USER@$HOST:/root/reservation_bot/docker-compose.yml"
          "${SCP[@]}" .env.example "$CLEAN_USER@$HOST:/root/reservation_bot/.env.example"

          # Step 3: Pull images, configure environment, and launch containers
          "${SSH[@]}" "$CLEAN_USER@$HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /root/reservation_bot

          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          # Initialize .env if missing
          if [ ! -f .env ]; then
            echo "⚠️ Initializing default .env from .env.example..."
            cp .env.example .env
          fi

          # Stop legacy PM2 process if still running to prevent port / bot polling conflicts
          if command -v pm2 > /dev/null 2>&1; then
            pm2 stop reservation-bot > /dev/null 2>&1 || true
            pm2 delete reservation-bot > /dev/null 2>&1 || true
          fi

          echo "📥 Pulling latest reservation bot image from GHCR..."
          docker pull ghcr.io/mmdhosain/reservation-bot:latest
          docker tag ghcr.io/mmdhosain/reservation-bot:latest reservation_bot_instagram-app:latest

          echo "🐳 Launching containers with Docker Compose..."
          if docker compose version >/dev/null 2>&1; then
            docker compose config -q
            docker compose up -d --no-build app db
            sleep 4
            echo "📊 Active Containers:"
            docker compose ps
            echo "📜 Application Logs:"
            docker compose logs --tail 30 app
          elif docker-compose version >/dev/null 2>&1; then
            docker-compose config -q
            docker-compose up -d --no-build app db
            sleep 4
            echo "📊 Active Containers:"
            docker-compose ps
            echo "📜 Application Logs:"
            docker-compose logs --tail 30 app
          else
            echo "❌ Error: Docker Compose is not installed on the server."
            exit 1
          fi

          echo "🎉 Deployment completed successfully! Reservation bot is running in Docker."
          REMOTE
