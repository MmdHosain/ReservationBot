name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Unit Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

  docker:
    name: 🐳 Docker Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: reservation-bot:latest

  deploy:
    name: 🚀 Continuous Deployment (VPS Docker)
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH & Run Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment on VPS..."
            TARGET_DIR="/root/DEV/reservation-bot"

            if [ ! -d "$TARGET_DIR" ]; then
              echo "📁 Target directory not found. Cloning repository to $TARGET_DIR..."
              mkdir -p /root/DEV
              git clone https://github.com/MmdHosain/ReservationBot.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "📥 Fetching latest changes from origin/main..."
            git remote set-url origin https://github.com/MmdHosain/ReservationBot.git || true
            git fetch origin main
            git reset --hard origin/main

            # Ensure .env exists
            if [ ! -f ".env" ]; then
              echo "⚠️ .env not found on server. Initializing from .env.example..."
              cp .env.example .env
            fi

            # Stop legacy PM2 process if exists to avoid port/token conflicts
            if command -v pm2 > /dev/null 2>&1; then
              pm2 stop reservation-bot > /dev/null 2>&1 || true
              pm2 delete reservation-bot > /dev/null 2>&1 || true
            fi

            # Deploy using Docker Compose
            echo "🐳 Starting Docker containers on VPS..."
            if docker compose version > /dev/null 2>&1; then
              docker compose down --remove-orphans || true
              docker compose up -d --build
              sleep 5
              docker compose ps
              docker compose logs --tail 30 app
            elif docker-compose version > /dev/null 2>&1; then
              docker-compose down --remove-orphans || true
              docker-compose up -d --build
              sleep 5
              docker-compose ps
              docker-compose logs --tail 30 app
            else
              echo "❌ Error: Neither 'docker compose' nor 'docker-compose' is installed on the server."
              exit 1
            fi

            echo "✅ Deployment finished and bot is actively running in Docker!"
