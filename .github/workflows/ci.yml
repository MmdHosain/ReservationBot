name: Build and Deploy Reservation Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/mmdhosain/reservation-bot:latest
            ghcr.io/mmdhosain/reservation-bot:${{ github.sha }}

  deploy:
    name: 🚀 Deploy to VPS via SSH & Docker
    needs: [test, build-and-push]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || secrets.SERVER_PORT }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.SERVER_USER || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SERVER_SSH_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          : "${VPS_HOST:?Missing secret VPS_HOST}"
          : "${VPS_PORT:?Missing secret VPS_PORT}"
          : "${VPS_SSH_KEY:?Missing secret VPS_SSH_KEY}"

          CLEAN_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\r\n\t "')
          CLEAN_PORT=$(printf '%s' "$VPS_PORT" | tr -d '\r\n\t "')
          CLEAN_USER=$(printf '%s' "${VPS_USER:-root}" | tr -d '\r\n\t "' | sed -e 's|@.*||')

          # Setup SSH key file with exact Unix newline formatting and secure permissions
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "📡 Connecting to: $CLEAN_USER@$CLEAN_HOST on port $CLEAN_PORT..."

          SSH_CMD="ssh -i $HOME/.ssh/deploy_key -p $CLEAN_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o KexAlgorithms=curve25519-sha256 -o ConnectTimeout=30"
          SCP_CMD="scp -i $HOME/.ssh/deploy_key -P $CLEAN_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o KexAlgorithms=curve25519-sha256 -o ConnectTimeout=30"

          # 1. Ensure target directory exists on server
          $SSH_CMD "$CLEAN_USER@$CLEAN_HOST" "mkdir -p /root/reservation_bot"

          # 2. Copy deployment configuration files
          echo "📁 Syncing docker-compose.yml and .env.example to VPS..."
          $SCP_CMD docker-compose.yml "$CLEAN_USER@$CLEAN_HOST:/root/reservation_bot/docker-compose.yml"
          $SCP_CMD .env.example "$CLEAN_USER@$CLEAN_HOST:/root/reservation_bot/.env.example"

          # 3. Authenticate Docker with GHCR if token is provided
          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "🔑 Authenticating Docker with GHCR on VPS..."
            printf '%s' "$GHCR_READ_TOKEN" | $SSH_CMD "$CLEAN_USER@$CLEAN_HOST" "docker login ghcr.io --username mmdhosain --password-stdin" || true
          fi

          # 4. Pull images, configure environment, and launch containers
          echo "🐳 Launching application on VPS..."
          $SSH_CMD "$CLEAN_USER@$CLEAN_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /root/reservation_bot

          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          # Initialize .env if missing
          if [ ! -f .env ]; then
            echo "⚠️ Initializing default .env from .env.example..."
            cp .env.example .env
          fi

          # Stop legacy PM2 process if still running to prevent port / bot polling conflicts
          if command -v pm2 > /dev/null 2>&1; then
            pm2 stop reservation-bot > /dev/null 2>&1 || true
            pm2 delete reservation-bot > /dev/null 2>&1 || true
          fi

          echo "📥 Pulling latest reservation bot image from GHCR..."
          docker pull ghcr.io/mmdhosain/reservation-bot:latest
          docker tag ghcr.io/mmdhosain/reservation-bot:latest reservation_bot_instagram-app:latest

          echo "🐳 Launching containers with Docker Compose..."
          if docker compose version >/dev/null 2>&1; then
            docker compose config -q
            docker compose up -d --no-build app db
            sleep 4
            echo "📊 Active Containers:"
            docker compose ps
            echo "📜 Application Logs:"
            docker compose logs --tail 30 app
          elif docker-compose version >/dev/null 2>&1; then
            docker-compose config -q
            docker-compose up -d --no-build app db
            sleep 4
            echo "📊 Active Containers:"
            docker-compose ps
            echo "📜 Application Logs:"
            docker-compose logs --tail 30 app
          else
            echo "❌ Error: Docker Compose is not installed on the server."
            exit 1
          fi

          echo "🎉 Deployment completed successfully! Reservation bot is running in Docker."
          REMOTE
