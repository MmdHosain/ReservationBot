name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Unit Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

  docker:
    name: 🐳 Docker Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: reservation-bot:latest

  deploy:
    name: 🚀 Continuous Deployment
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ] && [ -n "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "ℹ️ SSH deployment secrets (SERVER_HOST, SERVER_SSH_KEY) are not set. Skipping auto-deploy step."
          fi

      - name: Deploy to Remote Server
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying to server..."
            if [ -d "/root/DEV/reservation-bot" ]; then
              cd /root/DEV/reservation-bot
              git pull origin main || true
              if [ -f "docker-compose.yml" ]; then
                docker compose up -d --build
              else
                npm install
                pm2 restart reservation-bot || npm run start
              fi
              echo "✅ Deployment completed successfully!"
            else
              echo "⚠️ Directory /root/DEV/reservation-bot not found on server."
            fi
