name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Unit Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

  docker:
    name: 🐳 Docker Build Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: reservation-bot:latest

  deploy:
    name: 🚀 Continuous Deployment (VPS Docker)
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH & Run Docker
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -e

          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "❌ Missing SERVER_HOST or SERVER_SSH_KEY secrets."
            exit 1
          fi

          # 1. Clean & parse SERVER_HOST (handles 'ssh://root@ip:port', 'ip:port', 'ip', etc.)
          RAW_HOST=$(echo "$SERVER_HOST" | tr -d ' \r\n\t')
          PARSED_HOST=$(echo "$RAW_HOST" | sed -e 's|^ssh://||' -e 's|^.*@||')

          if echo "$PARSED_HOST" | grep -q ":"; then
            PORT_FROM_HOST=$(echo "$PARSED_HOST" | cut -d: -f2)
            TARGET_HOST=$(echo "$PARSED_HOST" | cut -d: -f1)
          else
            PORT_FROM_HOST=""
            TARGET_HOST="$PARSED_HOST"
          fi

          TARGET_PORT="${SERVER_PORT:-${PORT_FROM_HOST:-22}}"
          TARGET_USER="${SERVER_USER:-root}"

          echo "📡 Target VPS: $TARGET_USER@$TARGET_HOST on port $TARGET_PORT"

          # 2. Configure SSH private key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          # Ensure trailing newline
          sed -i -e '$a\' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 3. Connect to VPS and execute Docker deployment
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" 'bash -s' << 'REMOTE_SCRIPT'
            set -e
            echo "🚀 Successfully authenticated with VPS!"
            
            TARGET_DIR="/root/DEV/reservation-bot"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "📁 Target directory not found. Cloning repository into $TARGET_DIR..."
              mkdir -p /root/DEV
              git clone https://github.com/MmdHosain/ReservationBot.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "📥 Syncing latest codebase from origin/main..."
            git remote set-url origin https://github.com/MmdHosain/ReservationBot.git || true
            git fetch origin main
            git reset --hard origin/main

            # Ensure .env exists
            if [ ! -f ".env" ]; then
              echo "⚠️ .env not found on server. Creating default .env from .env.example..."
              cp .env.example .env
            fi

            # Stop legacy PM2 process if still running to prevent port / bot polling conflicts
            if command -v pm2 > /dev/null 2>&1; then
              pm2 stop reservation-bot > /dev/null 2>&1 || true
              pm2 delete reservation-bot > /dev/null 2>&1 || true
            fi

            echo "🐳 Deploying application with Docker Compose..."
            if docker compose version > /dev/null 2>&1; then
              docker compose down --remove-orphans || true
              docker compose up -d --build
              sleep 5
              echo "📊 Container Status:"
              docker compose ps
              echo "📜 Latest Bot Application Logs:"
              docker compose logs --tail 30 app
            elif docker-compose version > /dev/null 2>&1; then
              docker-compose down --remove-orphans || true
              docker-compose up -d --build
              sleep 5
              echo "📊 Container Status:"
              docker-compose ps
              echo "📜 Latest Bot Application Logs:"
              docker-compose logs --tail 30 app
            else
              echo "❌ Error: Docker Compose is not installed on the server."
              exit 1
            fi

            echo "🎉 Deployment finished successfully! The bot is running in Docker."
          REMOTE_SCRIPT
